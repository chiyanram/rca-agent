name: Commit messages

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check pushed commits follow Conventional Commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The same rule as the PR title (#48): a scope, a lower-case summary and the issue. Dependabot (scope deps) and
          # the release commit name no issue.
          pattern='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)\([a-z0-9-]+\)!?: [^A-Z].*\([^)]*#[0-9]+[^)]*\)'
          exempt='^[a-z]+\(deps\): |^chore\(release\): '
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$AFTER -1"
          else
            range="$BEFORE..$AFTER"
          fi
          bad=0
          while IFS= read -r line; do
            sha=${line%% *}; subject=${line#* }
            case "$subject" in Merge\ *) continue;; esac
            if ! printf '%s' "$subject" | grep -Eq "$pattern" && ! printf '%s' "$subject" | grep -Eq "$exempt"; then
              echo "::error::$sha does not follow Conventional Commits: $subject"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' $range)
          [ "$bad" -eq 0 ] && echo "All pushed commits follow Conventional Commits."
          exit $bad
