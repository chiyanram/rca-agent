name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # One rule in chiyanram/skills, agent-factory and rca-agent (#48): a scope, a lower-case summary and the issue it
      # works on, as (#N) or (owner/repo#N). Dependabot (scope deps) and the release commit name no issue. The title is
      # read from the environment, never interpolated into the script.
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)\([a-z0-9-]+\)!?: [^A-Z].*\([^)]*#[0-9]+[^)]*\)'
          exempt='^[a-z]+\(deps\): |^chore\(release\): '
          if [[ ! "$TITLE" =~ $pattern && ! "$TITLE" =~ $exempt ]]; then
            echo "::error::PR title \"$TITLE\" must be 'type(scope): lower-case summary (#issue)', e.g. 'feat(intake): accept a log bundle (#50)'. See CONTRIBUTING.md."
            exit 1
          fi
