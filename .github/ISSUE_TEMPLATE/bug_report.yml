name: Bug report
description: Something in the repository is wrong or broken.
labels: ["type:bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Leave credentials and private data out.
