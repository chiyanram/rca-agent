# Release configuration only for now. The [project] table (src/rca_agent, uv)
# is added in the build phase; then point version_toml at project.version.

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
build_command = ""
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
# templates/ is the default Markdown set with our release-note sections (#48); only .components/changes.md.j2 changed.
template_dir = "templates"
mode = "update"
insertion_flag = "<!-- version list -->"
exclude_commit_patterns = ['''^chore\(release\):''']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.remote]
type = "github"
ignore_token_for_push = false
